<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Einstellungen</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
    />
  </head>

  <body>
    <div id="app">
      <div class="iphone-app">
        <!-- Header -->
        <header class="app-header">
          <a href="startseite.html" class="back-link" title="Zurück zur Liste">
            <img src="icons/arrow_back.png" class="back-icon" alt="Zurück" />
          </a>
          <span class="site-titel">Einstellungen</span>
        </header>

        <!-- Inhalt -->
        <main class="app-content settings-page">
          <!-- Titelzeile -->
          <div class="wg-auswahl-container">
            <label class="wg-label"><strong>WG auswählen:</strong></label>
            <div class="dropdown">
              <input
                type="checkbox"
                id="dropdown-toggle"
                class="dropdown-checkbox"
              />
              <label
                for="dropdown-toggle"
                class="dropdown-label"
                v-text="selectedWGName ? selectedWGName : 'WG auswählen'"
              ></label>

              <ul class="dropdown-options">
                <li v-for="wg in wgList" :key="wg.id" @click="selectWG(wg.id)">
                  {{ wg.name }}
                </li>
              </ul>
            </div>
          </div>

          <hr />

          <!-- Optionen -->
          <div class="settings-option-row">
            <img src="icons/User_alt.svg" class="settings-icon" />
            <span class="settings-option-text">Mitglieder hinzufügen</span>
          </div>

          <div class="settings-option-row">
            <img src="icons/bookmark.png" class="settings-icon" />
            <span class="settings-option-text">Als neue Vorlage speichern</span>
          </div>

          <div class="settings-option-row">
            <img src="icons/Drucker.png" class="settings-icon" />
            <span class="settings-option-text">Liste exportieren</span>
          </div>

          <div class="settings-option-row">
            <img src="icons/clock.png" class="settings-icon" />
            <span class="settings-option-text">Änderungshistorie</span>
          </div>

          <div class="settings-option-row">
            <img src="icons/Listen.png" class="settings-icon" />
            <span class="settings-option-text">Produkte sortieren</span>
          </div>

          <hr />

          <!-- Löschen -->
          <div class="settings-option-row delete-row" @click="deleteWG">
            <img src="icons/Trashcan.png" class="settings-icon" />
            <span class="settings-delete-text">WG löschen</span>
          </div>
        </main>
      </div>
    </div>

    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.min.js"></script>
    <script>
      new Vue({
        el: "#app",
        data: {
          wgList: JSON.parse(localStorage.getItem("wgList")) || [
            { id: 1, name: "WG Sonnenstraße" },
            { id: 2, name: "WG Blumenweg" },
            { id: 3, name: "WG Fuchsbau" },
            { id: 4, name: "WG Mondhain" },
          ],
          selectedWG: localStorage.getItem("selectedWGID") || null,
          selectedWGName:
            localStorage.getItem("selectedWGName") || "WG auswählen",
          newGroupName: "",
        },
        methods: {
          selectWG(id) {
            document.getElementById("dropdown-toggle").checked = false;

            if (id === "__create__") {
              const name = prompt("Name der neuen WG:");
              if (!name) return;

              const newId = this.wgList.length + 1;
              const newWG = { id: newId, name };
              this.wgList.push(newWG);
              this.setWG(newWG);
              return;
            }

            const wg = this.wgList.find((w) => w.id === id);
            if (wg) {
              this.setWG(wg);
            }
          },
          setWG(wg) {
            this.selectedWG = wg.id;
            this.selectedWGName = wg.name;
          },
          //Logik löschen WG
          async deleteWG() {
            if (!this.selectedWG) {
              alert("Keine WG ausgewählt.");
              return;
            }

            const confirmed = confirm("Möchtest du diese WG wirklich löschen?");
            if (!confirmed) return;

            try {
              const response = await fetch(`/api/wg/${this.selectedWG}`, {
                method: "DELETE",
                headers: { "Content-Type": "application/json" },
              });

              if (!response.ok) {
                const error = await response.text();
                throw new Error(error);
              }

              alert("WG erfolgreich gelöscht.");

              // Optional: Auch im UI entfernen
              this.wgList = this.wgList.filter((w) => w.id != this.selectedWG);
              this.selectedWG = null;
              this.selectedWGName = "WG auswählen";

              // Weiterleitung
              location.href = "startseite.html";
            } catch (error) {
              console.error(error);
              alert("Fehler beim Löschen: " + error.message);
            }
          },
        },
      });
    </script>
  </body>
</html>
