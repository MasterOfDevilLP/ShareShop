<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Einstellungen</title>

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="wgForm.css" />
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
    />
  </head>

  <body>
    <!-- Load Vue.js -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.min.js"></script>

    <div id="setting">
      <div class="iphone-app">
        <!-- Header -->
        <header class="app-header">
          <a href="startseite.html" class="back-link" title="Zurück zur Liste">
            <img src="icons/arrow_back.png" class="back-icon" alt="Zurück" />
          </a>
          <span class="site-titel">Einstellungen</span>
        </header>

        <main class="app-content settings-page">
          <!-- WG-Bild & Beschreibung -->
          <div v-if="selectedWGDetails" class="wg-info-box">
            <img
              v-if="(selectedWGDetails && selectedWGDetails.image) || wgImageLocal"
              :src="(selectedWGDetails && selectedWGDetails.image) || wgImageLocal"
              alt="WG Bild"
              class="wg-image"
            />

            <div class="wg-text">
              <h4 class="wg-name">{{ selectedWGDetails.name }}</h4>

              <p
                v-if="(selectedWGDetails && selectedWGDetails.description) || wgDescLocal"
                class="wg-description"
              >
                {{ (selectedWGDetails && selectedWGDetails.description) || wgDescLocal }}
              </p>
            </div>

          </div>

          <!-- Titelzeile + Dropdown -->
          <div class="wg-auswahl-container">
            <label class="wg-label"><strong>WG auswählen:</strong></label>

            <div class="dropdown">
              <input
                type="checkbox"
                id="dropdown-toggle"
                class="dropdown-checkbox"
              />

              <!-- Klick auf Label toggelt Checkbox -->
              <label for="dropdown-toggle" class="dropdown-label">
                <strong>{{ selectedWGName || "WG auswählen" }}</strong>
              </label>

              <ul class="dropdown-options">
                <li
                  v-for="wg in wgList"
                  :key="wg.id"
                  @click="selectWG(wg.id)"
                >
                  {{ wg.name }}
                </li>
              </ul>
            </div>
          </div>

          <!-- Optionen -->
         <div
          class="settings-option-row"
          :class="{ disabled: !isOwner }"
          @click="requireOwner(() => (window.location.href = 'mitglieder_einladen.html'))"
        >
          <img src="icons/link.png" class="settings-icon" />
          <span class="settings-option-text">Mitglieder via Link einladen</span>
        </div>


          <!-- Mitglieder Liste -->
          <div class="wg-users-list">
            <div class="settings-option-row">
              <img src="icons/User_alt.svg" class="settings-icon" />
              <span class="settings-option-text">Mitglieder Liste</span>
            </div>

            <ul>
              <li v-for="user in wgUsers" :key="user.id">
                {{ user.name }}
              </li>
            </ul>
          </div>

          <div class="settings-option-row">
            <img src="icons/clock.png" class="settings-icon" />
            <span class="settings-option-text">Änderungshistorie</span>
          </div>

          <div class="settings-option-row">
            <img src="icons/Listen.png" class="settings-icon" />
            <span class="settings-option-text">Produkte sortieren</span>
          </div>

         <!-- WG verlassen-->
        <div
          class="settings-option-row delete-row"
          :class="{ disabled: !isOwner }"
          @click="requireOwner(leaveWG)"
        >
          <img src="icons/group_exit.png" class="settings-icon" />
          <span class="settings-delete-text">WG verlassen</span>
        </div>

        <!-- WG löschen (nur Besitzer klickbar) -->
        <div
          class="settings-option-row delete-row"
          :class="{ disabled: !isOwner }"
          @click="requireOwner(deleteWG)"
        >
          <img src="icons/Trashcan.png" class="settings-icon" />
          <span class="settings-delete-text">WG löschen</span>
        </div>


        </main>
      </div>
    </div>

    <script type="module" src="settings.js"></script>
  </body>
</html>
