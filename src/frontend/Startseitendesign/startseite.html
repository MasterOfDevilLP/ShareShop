<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Startseite</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#ffffff" />
  </head>
  <body>
    <!-- Load Vue.js -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.min.js"></script>

    <div id="app">
      <div class="iphone-app">
        <!-- Header -->
        <header class="app-header">
          <div class="wg-dropdown">
            <select class="wg-selector" v-model="selectedWG" @change="switchWG">
              <option v-for="wg in wgList" :key="wg.id" :value="wg.id">
                {{ wg.name }}
              </option>
              <option disabled>────────────</option>
              <option value="__create__">+ neue Gruppe erstellen</option>
            </select>
          </div>

          <span class="wg-name"> </span>
          <button class="qr-btn" title="QR">
            <img src="icons/barcode.png" class="nav-icon" />
          </button>
          <button class="settings-btn" title="settings">
            <img src="icons/settings.svg" />
          </button>
        </header>
        <!-- MODAL: Neue Gruppe erstellen -->
        <div v-if="showCreateGroupModal" class="modal-overlay">
          <div class="modal-content">
            <h3>Neue Gruppe erstellen</h3>
            <input v-model="newGroupName" placeholder="Gruppenname" />
            <div class="modal-actions">
              <button @click="createNewGroup">Erstellen</button>
              <button @click="showCreateGroupModal = false">Abbrechen</button>
            </div>
          </div>
        </div>
        <!-- Main Content -->
        <main class="app-content">
          <div class="shopping-list">
            <div v-for="list in lists" :key="list.id" class="list-card">
              <a href="../Einkaufsliste/einkaufsliste.html" class="list-left">
                <img src="icons/Wagen.png" alt="Cart Icon" class="nav-icon" />
                {{ list.name }}
                <span class="list-arrow">
                  <img
                    src="icons/arrow_right.svg"
                    alt="Arrow"
                    class="list-arrow"
                  />
                </span>
              </a>
            </div>
          </div>

          <button class="add-list" @click="add_list">
            <span>+</span> Liste hinzufügen
          </button>
        </main>

        <!-- Bottom Slide Popup zur Hinzufügung neuer Liste -->
        <div class="bottom-sheet" :class="{ visible: showPopup }">
          <div class="sheet-header">
            Neue Liste erstellen
            <button class="close-btn" id="closePopup" @click="closePopup">
              ✕
            </button>
          </div>
          <div class="sheet-body">
            <input
              type="text"
              v-model="newList.name"
              placeholder="Name der neuen Liste"
            />
            <button id="saveList" @click="saveList">Erstellen</button>
          </div>
        </div>

        <!-- Navigation -->
        <nav class="bottom-nav">
          <button class="nav-item active">
            <img
              src="icons/Liste.png"
              alt="Start"
              class="nav-icon"
            /><br />Liste
          </button>
          <button class="nav-item">
            <img
              src="icons/Rechnung.png"
              alt="Start"
              class="nav-icon"
            /><br />Rechnungen
          </button>
          <button class="nav-item">
            <img
              src="icons/Kalender.png"
              alt="Start"
              class="nav-icon"
            /><br />Kalender
          </button>
          <button class="nav-item">
            <img
              src="icons/Rezepte.png"
              alt="Start"
              class="nav-icon"
            /><br />Rezepte
          </button>
          <button class="nav-item">
            <img
              src="icons/Profil.png"
              alt="Start"
              class="nav-icon"
            /><br />Profil
          </button>
        </nav>
      </div>
    </div>

    <!-- App-Logik -->
    <script src="app.js"></script>
  </body>
</html>
