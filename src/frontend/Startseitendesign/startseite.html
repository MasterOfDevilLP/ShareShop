<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Startseite</title>

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="wgForm.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#ffffff" />
  </head>

  <body>
    <!-- Vue 2 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.min.js"></script>

    <div id="app">
      <div class="iphone-app">
        <!-- Header -->
        <header class="app-header">
          <div class="header-row">
            <!-- WG Dropdown -->
            <div class="wg-selector">
              <div class="dropdown">
                <input
                  type="checkbox"
                  id="dropdown-toggle"
                  class="dropdown-checkbox"
                  v-model="wgDropdownOpen"
                />

                <label for="dropdown-toggle" class="dropdown-label">
                  {{ selectedWGName || "WG auswählen" }}
                </label>

                <ul class="dropdown-options" v-if="wgDropdownOpen">
                  <li
                    v-for="wg in wgList"
                    :key="wgIdOf(wg)"
                    @click="selectWG(wgIdOf(wg))"
                  >
                    {{ wg.name }}
                  </li>

                  <li class="divider">──────────</li>

                  <li @click="selectWG('__create__')">+ neue Gruppe</li>
                </ul>
              </div>
            </div>

            <!-- Icons rechts -->
            <div class="icon-group">
              <a href="wg_qr_code.html" class="qr-btn" title="QR">
                <img src="icons/barcode.png" class="nav-icon" alt="QR" />
              </a>

              <a href="settings.html" class="settings-btn" title="Einstellungen">
                <img
                  src="icons/settings.svg"
                  alt="Einstellungen"
                  class="nav-icon"
                />
              </a>
            </div>
          </div>
        </header>

        <!-- Modal: Neue WG erstellen -->
        <div v-if="showCreateGroupModal" class="modal-overlay">
          <div class="modal-content">
            <h3>Neue WG erstellen</h3>

            <label>Name *</label>
            <input
              type="text"
              v-model.trim="newGroup.name"
              @input="validateGroupForm"
            />
            <span v-if="errors.name" class="error-text">{{ errors.name }}</span>

            <label>Beschreibung *</label>
            <textarea
              v-model.trim="newGroup.description"
              @input="validateGroupForm"
            ></textarea>
            <span v-if="errors.description" class="error-text">
              {{ errors.description }}
            </span>

            <label>Bild (optional)</label>
            <input type="file" accept="image/*" @change="handleImageUpload" />
            <img v-if="newGroup.preview" :src="newGroup.preview" width="100" alt="Vorschau" />

            <div class="btn-container">
              <button
                class="btn btn-green"
                :disabled="isSaving || !formValid"
                @click="saveGroup"
              >
                {{ isSaving ? "Speichert..." : "Erstellen" }}
              </button>

              <button class="btn btn-pink" @click="closeModal">
                Abbrechen
              </button>
            </div>

            <p v-if="saveSuccess" class="success-text">✅ WG gespeichert!</p>
            <p v-if="saveError" class="error-text">❌ {{ saveError }}</p>
          </div>
        </div>

        <!-- Content -->
        <main class="app-content">
          <div class="shopping-list">
            <div
              v-for="list in lists"
              :key="list.id"
              class="list-card"
              @click="goToList(list)"
            >
              <div class="list-left">
                <img src="icons/Wagen.png" alt="Warenkorb" class="nav-icon" />

                <div class="list-text">
                  <div class="list-title">{{ list.name }}</div>
                </div>

                <button class="list-dots" @click.stop="openListOptions(list)">
                  <img src="icons/dots.svg" alt="Mehr Optionen" />
                </button>
              </div>
            </div>
          </div>
        </main>

        <!-- Button: neue Liste hinzufügen -->
        <button class="add-list" @click="add_list">
          <span>+</span> Liste hinzufügen
        </button>

        <!-- Bottom Sheet: Liste hinzufügen -->
        <div class="bottom-sheet" :class="{ visible: showPopup }">
          <div class="sheet-header">
            Neue Liste erstellen
            <button class="close-btn" @click="closePopup">✕</button>
          </div>

          <div class="sheet-body">
            <div class="form-label-row">
              <label>Listenname *</label>
              <span class="err-inline" v-if="touched.name && !newList.name">
                Pflichtfeld
              </span>
            </div>

            <input
              type="text"
              v-model="newList.name"
              @blur="touched.name = true"
            />

            <p>WG: {{ selectedWGName }}</p>

            <button id="saveList" :disabled="!isListValid" @click="saveList">
              Erstellen
            </button>
          </div>
        </div>

        <!-- Bottom Sheet: Listenoptionen -->
        <div class="bottom-sheet full" :class="{ visible: showListOptions }">
          <div class="sheet-header">
            Liste verwalten
            <button class="close-btn" @click="closeListOptions">✕</button>
          </div>

          <div class="sheet-body list-actions">
            <button @click="openRenameModal">
              <img src="icons/pen.svg" alt="Bearbeiten" />
              <span>Umbenennen</span>
            </button>

            <button disabled>
              <img src="icons/external.svg" alt="Teilen" />
              <span>Teilen</span>
            </button>

            <button disabled>
              <img src="icons/copy.svg" alt="Kopieren" />
              <span>Kopieren</span>
            </button>

            <button
              class="danger"
              @click="selectedList && deleteList(selectedList.id)"
            >
              <img src="icons/Trash.svg" alt="Löschen" />
              <span>Löschen</span>
            </button>
          </div>
        </div>

        <!-- Modal: Liste umbenennen -->
        <div v-if="showRenameModal" class="modal-overlay">
          <div class="modal-content">
            <h3>Liste umbenennen</h3>

            <input v-model="renameListName" placeholder="Neuer Name der Liste" />

            <div class="modal-actions">
              <button @click="renameList">Speichern</button>
              <button @click="showRenameModal = false">Abbrechen</button>
            </div>
          </div>
        </div>

        <!-- Navigation -->
        <nav class="bottom-nav">
          <button class="nav-item active" type="button">
            <img src="icons/Liste.png" alt="Liste" class="nav-icon" /><br />
            Liste
          </button>

          <button class="nav-item" type="button">
            <img src="icons/Rechnung.png" alt="Rechnungen" class="nav-icon" /><br />
            Rechnungen
          </button>

          <button class="nav-item" type="button">
            <img src="icons/Kalender.png" alt="Kalender" class="nav-icon" /><br />
            Kalender
          </button>

          <button class="nav-item" type="button">
            <img src="icons/Rezepte.png" alt="Rezepte" class="nav-icon" /><br />
            Rezepte
          </button>

          <!-- Profil als Link (kein <a> im <button>) -->
          <a href="../profil/profil.html" class="nav-item">
            <img src="icons/Profil.png" alt="Profil" class="nav-icon" /><br />
            Profil
          </a>
        </nav>
      </div>
    </div>

    <!-- Optional: QRCode lib (nur nötig wenn du es hier wirklich nutzt) -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

    <!-- App Script -->
    <script type="module" src="app.js"></script>
  </body>
</html>
