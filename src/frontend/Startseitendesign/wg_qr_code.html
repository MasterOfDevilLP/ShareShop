<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Einstellungen</title>
    <link rel="stylesheet" href="wg_qr_code_style.css" />
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
    />
  </head>

  <body>
    <!-- Load Vue.js -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

    <!--Header-->
    <div id="app">
      <div class="iphone-app">
        <!-- Header -->
        <header class="app-header">
          <a href="startseite.html" class="back-link" title="Zurück zur WG Einstellungen">
            <img src="icons/arrow_back.png" class="back-icon" alt="Zurück" />
          </a>
          <span class="site-titel">QR Code zum Einladen</span>
        </header>

        <!-- Inhalt -->
        <main class="app-content settings-page">
            <p class="qr-card-text">
            Scannen Sie diesen QR-Code, um der WG beizutreten.
            </p>
            <hr>
            <div class="qr-card">
               <div class="qr-card-icon">
            <img src="icons/User_alt.svg" alt="WG Icon" />
            </div>
            <!--WG Name -->
            <h2 class="qr-card-title">{{ 'WG: ' + (selectedWGName || 'WG Name') }}</h2>
                
            <!--QR Code Bild-->
                <div class="qr-code-container">
                <img :src="qrCodeDataUrl" alt="WG Einladungs QR-Code" class="qr-code-image" />
                </div>
            </div>

          <button class="scan-btn" @click="scanOtherQR">
            Andere WG beitreten
          </button>  

          <video ref="video" class="qr-video" autoplay playsinline></video>
          <input type="file" ref="fileInput" accept="image/*" style="display:none;" @change="handleFileUpload">

          <!-- QR Code Option Modal -->
          <div v-if="showQRChoiceModal" class="modal-backdrop" @click.self="showQRChoiceModal=false">
            <div class="modal-content">
              <div class="modal-actions">
                <button @click="startCameraScan">QR-Code scannen</button>
                <button @click="$refs.fileInput.click(); showQRChoiceModal=false">Bild hochladen</button>
              </div>
              <input type="file" ref="fileInput" accept="image/*" hidden @change="handleFileUpload" />
            </div>
          </div>

        </main>
      </div>
  </body>
</html>

<script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
<script type="module" src="app.js"></script>
